<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5;">
  <h2>Reset your password</h2>
  <p>Hi <span th:text="${name}">there</span>, we received a request to reset your Javora password.</p>
  <p>
    <a th:href="${link}" style="display: inline-block; padding: 10px 20px; background: #111827; color: #ffffff; text-decoration: none; border-radius: 6px;">
      Choose a new password
    </a>
  </p>
  <p>This link expires in 1 hour. If you did not request this, you can safely ignore this email.</p>
</body>
</html>
